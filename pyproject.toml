[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventsim-mcp"
version = "0.7.1"
description = "MCP server that lets AI assistants read and inspect Ventsim mine ventilation model (.vsm) files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "numpy>=1.24", "scipy>=1.10"]
keywords = ["ventsim", "mcp", "mine ventilation", "mining"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ventsim-mcp = "ventsim_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ventsim_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
