name: publish
# Runs when a GitHub release is published (or by hand). Needs, once:
#  - PyPI trusted publisher for this repo/workflow (pypi.org > Publishing > add a pending
#    publisher: owner agenticeram, repo ventsim-mcp, workflow publish.yml, environment pypi)
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          file="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/$file.sigstore.json"
          cosign verify-blob "$file" --bundle "$file.sigstore.json" \
            --certificate-identity-regexp "^https://github.com/modelcontextprotocol/registry/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          tar xzf "$file" mcp-publisher
          rm "$file" "$file.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
